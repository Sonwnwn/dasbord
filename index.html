<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Природа и среда — дашборд</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">

    <header class="header">
      <h1>Природа и среда</h1>
      <p class="subtitle">Погода, качество воздуха и заметки о регионе</p>
    </header>

    <main class="dashboard">

      <!-- Управление городом -->
      <section class="controls" aria-label="Выбор региона">
        <label for="city-input">Регион:</label>
        <input type="text" id="city-input" placeholder="Например, Сочи" value="Сочи">
        <button id="search-btn" type="button">Найти</button>
        <p id="city-status" class="status" aria-live="polite"></p>
      </section>

      <!-- Виджет 1: Погода -->
      <section class="widget" id="weather-widget" aria-labelledby="weather-title">
        <div class="widget-header">
          <h2 id="weather-title">🌡️ Погода</h2>
          <button class="refresh-btn" id="weather-refresh" type="button">Обновить</button>
        </div>
        <div class="widget-body">
          <p id="weather-now" aria-live="polite">Загрузка…</p>
          <p id="weather-today"></p>
          <p class="meta" id="weather-meta"></p>
        </div>
      </section>

      <!-- Виджет 2: Качество воздуха -->
      <section class="widget" id="air-widget" aria-labelledby="air-title">
        <div class="widget-header">
          <h2 id="air-title">🌿 Качество воздуха</h2>
          <button class="refresh-btn" id="air-refresh" type="button">Обновить</button>
        </div>
        <div class="widget-body">
          <p id="air-aqi" aria-live="polite">Загрузка…</p>
          <p id="air-particles"></p>
          <p class="meta" id="air-meta"></p>
        </div>
      </section>

      <!-- Виджет 3: Заметки -->
      <section class="widget widget--wide" id="notes-widget" aria-labelledby="notes-title">
        <div class="widget-header">
          <h2 id="notes-title">📝 Заметки о регионе</h2>
        </div>
        <div class="widget-body">
          <form id="note-form" class="note-form">
            <label for="note-input" class="visually-hidden">Новая заметка</label>
            <input type="text" id="note-input" placeholder="Что заметили в этом регионе?" maxlength="120">
            <button type="submit">Добавить</button>
          </form>
          <ul id="notes-list"></ul>
          <p class="meta" id="notes-meta"></p>
        </div>
      </section>

    </main>

    <footer class="footer">
      <p>Данные: <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo Forecast</a> · <a href="https://open-meteo.com/en/docs/air-quality-api" target="_blank" rel="noopener">Open-Meteo Air Quality</a></p>
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
